<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentos e ç -->
    <meta charset="UTF-8">
    
    <!-- Garante o layout responsivo em telas de celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Previsão do Tempo</title>
    
    <!-- Importação do arquivo de estilos CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container principal que centraliza o cartão na tela -->
    <div class="container">
        
        <!-- Título principal da aplicação -->
        <h1>🌤️ Previsão do Tempo</h1>

        <!-- Caixas de entrada (input + botão de pesquisa) -->
        <div class="search-box">
            <!-- Campo de texto onde o usuário digita a cidade -->
            <input type="text" id="city-input" placeholder="Digite o nome da cidade...">
            
            <!-- Botão que aciona a busca no clique -->
            <button id="search-btn">Buscar</button>
        </div>

        <!-- Área dos resultados do clima (Inicia escondida com a classe "hide") -->
        <div id="weather-data" class="hide">
            
            <!-- Nome da cidade e país (ex: "Porto Alegre, BR") -->
            <h2 id="city"></h2>
            
            <!-- Bloco para alinhar o ícone do tempo e a temperatura lado a lado -->
            <div class="temp-container">
                <!-- Ícone do clima retornado pela API (ex: sol, nuvem, chuva) -->
                <img id="weather-icon" src="" alt="Ícone do tempo">
                
                <!-- Valor da temperatura formatado em Celsius -->
                <p id="temperature"></p>
            </div>
            
            <!-- Descrição em texto do clima (ex: "Céu limpo", "Chuva fraca") -->
            <p id="description"></p>
            
            <!-- Detalhes adicionais (Umidade e Vento) -->
            <div class="details">
                <p>💧 Umidade: <span id="humidity"></span></p>
                <p>💨 Vento: <span id="wind"></span></p>
            </div>
        </div>

        <!-- Mensagem de erro (Inicia escondida e só aparece se a cidade não for encontrada) -->
        <p id="error-message" class="hide">Cidade não encontrada. Tente novamente!</p>

    </div>

    <!-- Script JavaScript com o atributo "defer" para carregar após a leitura do HTML -->
    <script src="js/script.js" defer></script>
</body>
</html>
